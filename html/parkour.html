<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skybound Parkour</title>
  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #151f3b;
      --panel: rgba(15, 20, 38, 0.7);
      --cyan: #7afcff;
      --pink: #ff7ad9;
      --gold: #ffd166;
      --lime: #b7ff7a;
      --text: #edf6ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(122, 252, 255, 0.18), transparent 20%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
      font-family: Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    .game-shell {
      position: relative;
      border: 3px solid rgba(122, 252, 255, 0.4);
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(122, 252, 255, 0.2), inset 0 0 30px rgba(255,255,255,0.05);
      background: rgba(9, 12, 24, 0.8);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: min(92vw, 1000px);
      height: auto;
      background: linear-gradient(#6dd3ff 0%, #b6ecff 32%, #dff8ff 100%);
      image-rendering: auto;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    }

    .chip {
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(9, 12, 24, 0.3);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .chip strong {
      color: var(--gold);
      font-size: 16px;
    }

    .tips {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(9, 12, 24, 0.35);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <canvas id="gameCanvas" width="1000" height="560"></canvas>
    <div class="hud">
      <div class="chip">Score <strong id="score">0</strong></div>
      <div class="chip">Stars <strong id="stars">0</strong></div>
      <div class="chip">Goal <strong id="goal">0m</strong></div>
    </div>
    <div class="tips">Move: A/D or ←/→ • Jump: W / ↑ / Space • Restart: R</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const starsEl = document.getElementById('stars');
    const goalEl = document.getElementById('goal');

    const WORLD = {
      gravity: 0.58,
      groundY: canvas.height - 54,
      goalX: 7000,
      platforms: [],
      stars: [],
      spikes: [],
      clouds: [],
      finish: null
    };

    const input = {
      left: false,
      right: false,
      jumpQueued: false
    };

    const player = {
      x: 100,
      y: 250,
      w: 30,
      h: 52,
      vx: 0,
      vy: 0,
      speed: 5.3,
      jumpPower: 12.2,
      onGround: false,
      facing: 1,
      trail: []
    };

    const game = {
      started: false,
      state: 'playing',
      score: 0,
      stars: 0,
      distance: 0,
      cameraX: 0,
      best: Number(localStorage.getItem('skyparkour_best') || 0)
    };

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function circleRectCollision(cx, cy, r, rect) {
      const closestX = clamp(cx, rect.x, rect.x + rect.w);
      const closestY = clamp(cy, rect.y, rect.y + rect.h);
      const dx = cx - closestX;
      const dy = cy - closestY;
      return dx * dx + dy * dy < r * r;
    }

    function createCloud(x, y, s) {
      return { x, y, s, drift: rand(0.2, 1.3) };
    }

    function buildWorld() {
      WORLD.platforms = [];
      WORLD.stars = [];
      WORLD.spikes = [];
      WORLD.clouds = [];

      for (let i = 0; i < 10; i++) {
        WORLD.clouds.push(createCloud(rand(40, 900), rand(60, 200), rand(0.8, 1.8)));
      }

      let x = 0;
      let groundY = WORLD.groundY;

      while (x < 8300) {
        const width = rand(180, 260);
        const platformY = Math.random() < 0.22 ? rand(180, 330) : groundY;
        const platform = {
          x,
          y: platformY,
          w: width,
          h: 22,
          type: platformY === groundY ? 'ground' : 'float'
        };
        WORLD.platforms.push(platform);

        if (Math.random() < 0.7) {
          const starCount = Math.random() < 0.4 ? 1 : 2;
          for (let i = 0; i < starCount; i++) {
            WORLD.stars.push({
              x: x + width * (0.25 + i * 0.45),
              y: platformY - rand(36, 72),
              r: rand(8, 12),
              collected: false
            });
          }
        }

        if (platformY === groundY && Math.random() < 0.52) {
          const spikeW = rand(18, 32);
          WORLD.spikes.push({
            x: x + width * rand(0.3, 0.7),
            y: groundY - 18,
            w: spikeW,
            h: 18
          });
        }

        x += width + rand(110, 180);
      }

      WORLD.goalX = x - 420;
      WORLD.finish = { x: WORLD.goalX, y: WORLD.groundY - 120, w: 22, h: 120 };
    }

    function resetGame() {
      player.x = 80;
      player.y = WORLD.groundY - player.h;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.trail = [];
      game.score = 0;
      game.stars = 0;
      game.distance = 0;
      game.state = 'playing';
      game.started = true;
      game.cameraX = 0;
      buildWorld();
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = Math.floor(game.score);
      starsEl.textContent = game.stars;
      goalEl.textContent = Math.max(0, Math.floor((Math.min(player.x, WORLD.goalX) / 10))) + 'm';
    }

    function handleInput() {
      const move = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      player.vx = move * player.speed;
      if (move !== 0) player.facing = move;

      if (input.jumpQueued && player.onGround) {
        player.vy = -player.jumpPower;
        player.onGround = false;
        input.jumpQueued = false;
      }

      if (input.jumpQueued && !player.onGround) {
        input.jumpQueued = false;
      }
    }

    function updatePlayer() {
      const prevX = player.x;
      const prevY = player.y;
      const prevBottom = prevY + player.h;

      player.vy += WORLD.gravity;
      player.x += player.vx;
      player.y += player.vy;

      player.onGround = false;

      for (const platform of WORLD.platforms) {
        if (!rectsOverlap(player, platform)) continue;

        const playerBottom = player.y + player.h;
        const playerRight = player.x + player.w;
        const playerLeft = player.x;

        if (player.vy >= 0 && prevBottom <= platform.y + 12 && playerBottom >= platform.y) {
          player.y = platform.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if (player.vy < 0 && prevY >= platform.y + platform.h - 10) {
          player.y = platform.y + platform.h;
          player.vy = 0;
        } else if (prevX + player.w <= platform.x + 8) {
          player.x = platform.x - player.w;
          player.vx = 0;
        } else if (prevX >= platform.x + platform.w - 8) {
          player.x = platform.x + platform.w;
          player.vx = 0;
        } else if (playerRight > platform.x && playerLeft < platform.x + platform.w && playerBottom < platform.y + platform.h) {
          player.y = platform.y - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      }

      if (player.y > canvas.height + 220) {
        lose();
      }

      player.trail.push({ x: player.x + player.w / 2, y: player.y + player.h, alpha: 1 });
      if (player.trail.length > 9) player.trail.shift();
      for (const dot of player.trail) dot.alpha *= 0.86;

      for (const star of WORLD.stars) {
        if (!star.collected && circleRectCollision(star.x, star.y, star.r, player)) {
          star.collected = true;
          game.score += 30;
          game.stars += 1;
        }
      }

      for (const spike of WORLD.spikes) {
        if (rectsOverlap(player, spike)) {
          lose();
          return;
        }
      }

      if (player.x > WORLD.goalX) {
        win();
      }

      game.distance = Math.max(game.distance, player.x);
      game.score += 0.2;
      updateHud();
    }

    function lose() {
      game.state = 'lost';
      game.best = Math.max(game.best, Math.floor(game.score));
      localStorage.setItem('skyparkour_best', String(game.best));
      updateHud();
    }

    function win() {
      game.state = 'won';
      game.best = Math.max(game.best, Math.floor(game.score));
      localStorage.setItem('skyparkour_best', String(game.best));
      updateHud();
    }

    function update() {
      if (game.state !== 'playing') return;
      handleInput();
      updatePlayer();

      const targetCamera = clamp(player.x - canvas.width * 0.28, 0, WORLD.goalX - canvas.width * 0.2);
      game.cameraX += (targetCamera - game.cameraX) * 0.08;

      for (const cloud of WORLD.clouds) {
        cloud.x -= 0.15 + cloud.drift * 0.25;
        if (cloud.x < -120) {
          cloud.x = canvas.width + 80;
          cloud.y = rand(30, 170);
        }
      }
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#61d2ff');
      sky.addColorStop(0.35, '#baf0ff');
      sky.addColorStop(1, '#edf8ff');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255, 210, 80, 0.9)';
      ctx.beginPath();
      ctx.arc(canvas.width - 120, 90, 42, 0, Math.PI * 2);
      ctx.fill();

      for (const cloud of WORLD.clouds) {
        const x = cloud.x - game.cameraX * 0.2;
        const y = cloud.y;
        const s = cloud.s;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
        ctx.arc(x + 18 * s, y - 10 * s, 18 * s, 0, Math.PI * 2);
        ctx.arc(x + 38 * s, y, 20 * s, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#9ad97b';
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      for (let i = 0; i < 13; i++) {
        const px = i * 110 - (game.cameraX * 0.4) % 110;
        const py = canvas.height - (i % 2 === 0 ? 120 : 90);
        ctx.lineTo(px, py);
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();
      ctx.fill();
    }

    function drawPlatforms() {
      for (const platform of WORLD.platforms) {
        const x = platform.x - game.cameraX;
        const y = platform.y;

        if (platform.type === 'ground') {
          ctx.fillStyle = '#2b7a4b';
          ctx.fillRect(x, y, platform.w, platform.h);
          ctx.fillStyle = '#5ecf79';
          ctx.fillRect(x, y, platform.w, 7);
        } else {
          ctx.fillStyle = '#1f8db2';
          ctx.fillRect(x, y, platform.w, platform.h);
          ctx.fillStyle = '#6ce4ff';
          ctx.fillRect(x, y, platform.w, 5);
        }
      }

      for (const spike of WORLD.spikes) {
        const x = spike.x - game.cameraX;
        const y = spike.y;
        ctx.fillStyle = '#f94d67';
        ctx.beginPath();
        ctx.moveTo(x, y + spike.h);
        ctx.lineTo(x + spike.w / 2, y);
        ctx.lineTo(x + spike.w, y + spike.h);
        ctx.closePath();
        ctx.fill();
      }

      for (const star of WORLD.stars) {
        if (star.collected) continue;
        const sx = star.x - game.cameraX;
        const sy = star.y;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate((performance.now() / 250) % (Math.PI * 2));
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const outer = star.r;
          const inner = star.r * 0.45;
          const ang = (Math.PI / 180) * (i * 72 - 90);
          const x1 = Math.cos(ang) * outer;
          const y1 = Math.sin(ang) * outer;
          const x2 = Math.cos(ang + Math.PI / 5) * inner;
          const y2 = Math.sin(ang + Math.PI / 5) * inner;
          if (i === 0) ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      const fx = WORLD.finish.x - game.cameraX;
      ctx.fillStyle = '#e9f2ff';
      ctx.fillRect(fx, WORLD.groundY - 120, 6, 120);
      ctx.fillStyle = '#ff7ad9';
      ctx.beginPath();
      ctx.moveTo(fx + 6, WORLD.groundY - 120);
      ctx.lineTo(fx + 90, WORLD.groundY - 96);
      ctx.lineTo(fx + 6, WORLD.groundY - 72);
      ctx.closePath();
      ctx.fill();
    }

    function drawPlayer() {
      const px = player.x - game.cameraX;
      const py = player.y;

      for (let i = 0; i < player.trail.length; i++) {
        const dot = player.trail[i];
        const alpha = Math.max(0, dot.alpha * 0.8);
        ctx.fillStyle = `rgba(49, 95, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(dot.x - game.cameraX, dot.y, (i / player.trail.length) * 12 + 5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#ff9f1c';
      ctx.fillRect(px + 4, py + 8, 22, 32);
      ctx.fillStyle = '#1f2b4d';
      ctx.fillRect(px + 5, py + 13, 6, 7);
      ctx.fillRect(px + 19, py + 13, 6, 7);
      ctx.fillStyle = '#46d6ff';
      ctx.fillRect(px + 8, py + 28, 14, 8);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px + 7, py + 10, 4, 4);
      ctx.fillRect(px + 19, py + 10, 4, 4);
    }

    function drawOverlay() {
      if (game.state === 'playing') return;

      ctx.fillStyle = 'rgba(6, 11, 20, 0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#edf6ff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 48px Arial';
      const message = game.state === 'won' ? 'You WON!' : 'You crashed!';
      ctx.fillText(message, canvas.width / 2, canvas.height / 2 - 14);

      ctx.font = '24px Arial';
      ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 30);
    }

    function render() {
      drawBackground();
      drawPlatforms();
      drawPlayer();
      drawOverlay();
    }

    function loop(time) {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['arrowleft', 'arrowright', 'arrowup', 'a', 'd', 'w', ' ', 'r'].includes(key) || event.key === ' ') {
        event.preventDefault();
      }

      if (key === 'arrowleft' || key === 'a') input.left = true;
      if (key === 'arrowright' || key === 'd') input.right = true;
      if (key === 'arrowup' || key === 'w' || event.key === ' ') {
        input.jumpQueued = true;
      }
      if (key === 'r' && game.state !== 'playing') {
        resetGame();
      }
    });

    window.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') input.left = false;
      if (key === 'arrowright' || key === 'd') input.right = false;
    });

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
