<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Dodge</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #1b2a66 0%, #050814 70%);
      color: #ffffff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .overlay {
      position: absolute;
      left: 24px;
      top: 18px;
      z-index: 2;
      max-width: 360px;
      padding: 18px 22px;
      border-radius: 18px;
      background: rgba(6, 13, 29, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }
    .overlay h1 {
      margin: 0 0 10px;
      font-size: 1.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f9f6ff;
    }
    .overlay p {
      margin: 0 0 16px;
      line-height: 1.5;
      color: #cfd6ff;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      color: #e9f0ff;
      font-size: 0.98rem;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 0.96rem;
      cursor: pointer;
      color: #0b142d;
      background: linear-gradient(135deg, #ffcf56, #ff6b8a);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 24px rgba(255, 150, 125, 0.22);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(255, 150, 125, 0.32);
    }
    @media (max-width: 520px) {
      .overlay {
        left: 12px;
        right: 12px;
        padding: 16px;
      }
      .overlay h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Star Dodge</h1>
    <p>Move your mouse or finger to steer the ship. Collect glowing stars and avoid falling meteors.</p>
    <div class="hud">
      <div>Score: <strong id="score">0</strong></div>
      <div>Level: <strong id="level">1</strong></div>
    </div>
    <button id="restart">Start Game</button>
  </div>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const ship = { x: width / 2, y: height - 96, r: 24 };
    const mouse = { x: width / 2 };
    let objects = [];
    let score = 0;
    let level = 1;
    let gameOver = false;
    let spawnTimer = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      ship.y = height - 96;
      ship.x = Math.min(Math.max(ship.x, ship.r), width - ship.r);
      mouse.x = ship.x;
    }
    window.addEventListener('resize', resize);

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnObject() {
      const type = Math.random() < 0.26 ? 'star' : 'rock';
      const size = type === 'star' ? random(12, 18) : random(18, 28);
      objects.push({
        x: random(size * 1.8, width - size * 1.8),
        y: -size * 2,
        vy: random(2.2 + level * 0.35, 4.4 + level * 0.7),
        type,
        r: size,
        angle: random(0, Math.PI * 2),
        spin: random(-0.04, 0.04)
      });
    }

    function updateHud() {
      document.getElementById('score').textContent = score;
      document.getElementById('level').textContent = level;
    }

    function drawShip() {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.beginPath();
      ctx.moveTo(0, -ship.r);
      ctx.lineTo(ship.r * 1.25, ship.r);
      ctx.lineTo(-ship.r * 1.25, ship.r);
      ctx.closePath();
      const gradient = ctx.createLinearGradient(-ship.r, -ship.r, ship.r, ship.r);
      gradient.addColorStop(0, '#e5faff');
      gradient.addColorStop(1, '#9ad7ff');
      ctx.fillStyle = gradient;
      ctx.shadowColor = 'rgba(255,255,255,0.28)';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.restore();
    }

    function drawStar(x, y, r, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = 'rgba(255, 239, 136, 0.94)';
      ctx.shadowColor = 'rgba(255, 223, 96, 0.45)';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const radius = i % 2 === 0 ? r : r * 0.4;
        const theta = (Math.PI / 5) * i;
        const px = Math.cos(theta) * radius;
        const py = Math.sin(theta) * radius;
        ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawRock(x, y, r, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      const grad = ctx.createRadialGradient(0, 0, r * 0.15, 0, 0, r);
      grad.addColorStop(0, '#999');
      grad.addColorStop(1, '#222');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#09102a');
      gradient.addColorStop(0.45, '#08132f');
      gradient.addColorStop(1, '#040610');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      const glow = ctx.createRadialGradient(width * 0.75, height * 0.18, 0, width * 0.75, height * 0.18, width * 0.35);
      glow.addColorStop(0, 'rgba(136, 167, 255, 0.28)');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);
      for (let i = 0; i < 60; i++) {
        const starX = ((i * 73) % width) + (Math.sin(i * 1.3 + performance.now() * 0.001) * 20);
        const starY = ((i * 47) % height) + (Math.cos(i * 0.9 + performance.now() * 0.0015) * 18);
        const opacity = 0.2 + (Math.sin((performance.now() * 0.002 + i) * 0.7) + 1) * 0.12;
        ctx.fillStyle = `rgba(255,255,255,${opacity})`;
        ctx.beginPath();
        ctx.arc((starX + width) % width, (starY + height) % height, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function update() {
      if (gameOver) return;
      ship.x += (mouse.x - ship.x) * 0.14;
      ship.x = Math.max(ship.r, Math.min(width - ship.r, ship.x));
      spawnTimer += 1;
      if (spawnTimer > Math.max(18, 42 - level * 2.4)) {
        spawnTimer = 0;
        spawnObject();
      }
      objects = objects.filter(obj => {
        obj.y += obj.vy;
        obj.angle += obj.spin;
        const dist = Math.hypot(obj.x - ship.x, obj.y - ship.y);
        if (obj.type === 'star' && dist < obj.r + ship.r - 6) {
          score += 15;
          level = 1 + Math.floor(score / 120);
          updateHud();
          return false;
        }
        if (obj.type === 'rock' && dist < obj.r + ship.r - 4) {
          gameOver = true;
          return false;
        }
        return obj.y < height + obj.r;
      });
    }

    function draw() {
      drawBackground();
      objects.forEach(obj => {
        if (obj.type === 'star') drawStar(obj.x, obj.y, obj.r, obj.angle);
        else drawRock(obj.x, obj.y, obj.r, obj.angle);
      });
      drawShip();
      if (gameOver) {
        ctx.fillStyle = 'rgba(3, 7, 20, 0.76)';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.font = '72px Inter, system-ui, sans-serif';
        ctx.fillText('GAME OVER', width / 2, height / 2 - 24);
        ctx.font = '22px Inter, system-ui, sans-serif';
        ctx.fillText('Press restart to play again', width / 2, height / 2 + 28);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.getElementById('restart').addEventListener('click', () => {
      score = 0;
      level = 1;
      objects = [];
      gameOver = false;
      updateHud();
      document.getElementById('restart').textContent = 'Restart';
    });

    canvas.addEventListener('mousemove', event => {
      mouse.x = event.clientX;
    });
    canvas.addEventListener('touchmove', event => {
      event.preventDefault();
      mouse.x = event.touches[0].clientX;
    }, { passive: false });

    updateHud();
    loop();
  </script>
</body>
</html>
