<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Match Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 1.1em;
        }

        .score, .level {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            color: #667eea;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 30px 0;
        }

        .box {
            width: 100%;
            aspect-ratio: 1;
            border: none;
            border-radius: 10px;
            font-size: 2em;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .box:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .box:active {
            transform: translateY(-2px);
        }

        .box.matched {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: white;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .reset-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.5);
        }

        .message {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
            min-height: 30px;
            color: #667eea;
        }

        .winner {
            color: #38ef7d;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .difficulty {
            margin-bottom: 20px;
        }

        .difficulty button {
            padding: 8px 16px;
            margin: 5px;
            font-size: 0.9em;
            background: #ddd;
            color: #333;
        }

        .difficulty button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Color Match</h1>
        <p style="color: #999; margin-bottom: 20px;">Match the colors and test your memory!</p>
        
        <div class="info">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="level">Level: <span id="level">1</span></div>
        </div>

        <div class="difficulty">
            <button onclick="setDifficulty('easy')" class="active" id="easy-btn">Easy</button>
            <button onclick="setDifficulty('medium')" id="medium-btn">Medium</button>
            <button onclick="setDifficulty('hard')" id="hard-btn">Hard</button>
        </div>

        <div class="game-grid" id="gameGrid"></div>

        <div class="message" id="message"></div>

        <div class="controls">
            <button class="start-btn" onclick="startGame()">Start Game</button>
            <button class="reset-btn" onclick="resetGame()">Reset</button>
        </div>
    </div>

    <script>
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9', '#F8B739'];
        let gameBoard = [];
        let moves = [];
        let score = 0;
        let level = 1;
        let gameActive = false;
        let difficulty = 'easy';
        let gridSize = 6;

        function setDifficulty(d) {
            difficulty = d;
            document.getElementById('easy-btn').classList.remove('active');
            document.getElementById('medium-btn').classList.remove('active');
            document.getElementById('hard-btn').classList.remove('active');
            
            if (d === 'easy') {
                gridSize = 4;
                document.getElementById('easy-btn').classList.add('active');
            } else if (d === 'medium') {
                gridSize = 6;
                document.getElementById('medium-btn').classList.add('active');
            } else {
                gridSize = 8;
                document.getElementById('hard-btn').classList.add('active');
            }
            resetGame();
        }

        function createBoard() {
            gameBoard = [];
            for (let i = 0; i < gridSize; i++) {
                gameBoard.push({
                    color: colors[i % colors.length],
                    matched: false,
                    id: i
                });
            }
            gameBoard = gameBoard.sort(() => Math.random() - 0.5);
            renderBoard();
        }

        function renderBoard() {
            const grid = document.getElementById('gameGrid');
            grid.style.gridTemplateColumns = `repeat(${Math.sqrt(gridSize)}, 1fr)`;
            grid.innerHTML = '';
            
            gameBoard.forEach((item, index) => {
                const box = document.createElement('button');
                box.className = 'box';
                if (item.matched) box.classList.add('matched');
                box.style.background = item.matched ? 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)' : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                box.style.color = item.matched ? '#fff' : '#fff';
                box.innerText = item.matched ? '✓' : '?';
                box.onclick = () => clickBox(index, box);
                grid.appendChild(box);
            });
        }

        function clickBox(index, element) {
            if (!gameActive || gameBoard[index].matched) return;
            
            gameBoard[index].matched = true;
            element.style.background = `linear-gradient(135deg, ${gameBoard[index].color} 0%, ${gameBoard[index].color} 100%)`;
            element.innerText = gameBoard[index].color.substring(1).toUpperCase();
            moves.push(index);
            
            score += 10;
            document.getElementById('score').textContent = score;

            if (moves.length === gridSize) {
                gameActive = false;
                document.getElementById('message').innerHTML = '🎉 Level Complete!';
                document.getElementById('message').classList.add('winner');
                setTimeout(nextLevel, 1500);
            }
        }

        function startGame() {
            gameActive = true;
            moves = [];
            createBoard();
            document.getElementById('message').innerHTML = 'Good Luck! 🍀';
            document.getElementById('message').classList.remove('winner');
        }

        function nextLevel() {
            level++;
            document.getElementById('level').textContent = level;
            moves = [];
            createBoard();
            gameActive = true;
            document.getElementById('message').innerHTML = 'Next Level!';
        }

        function resetGame() {
            gameActive = false;
            score = 0;
            level = 1;
            moves = [];
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('message').innerHTML = '';
            document.getElementById('gameGrid').innerHTML = '';
            document.getElementById('message').classList.remove('winner');
        }

        resetGame();
    </script>
</body>
</html>
