<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Match Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .score {
            font-size: 1.2em;
            color: #764ba2;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 2em;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            color: white;
            font-weight: bold;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .card.flipped {
            background: white;
            color: #667eea;
        }

        .card.matched {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            cursor: default;
            color: white;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .reset-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .difficulty-btn {
            background: #f093fb;
            color: white;
            padding: 10px 20px;
            font-size: 0.9em;
        }

        .difficulty-btn.active {
            background: #667eea;
            transform: scale(1.05);
        }

        .difficulty-btn:hover {
            background: #667eea;
        }

        .message {
            font-size: 1.3em;
            color: #764ba2;
            font-weight: bold;
            margin-top: 20px;
            height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Memory Match</h1>
        <div class="score">Score: <span id="score">0</span></div>
        
        <div class="controls">
            <button class="difficulty-btn active" data-difficulty="easy">Easy (2x2)</button>
            <button class="difficulty-btn" data-difficulty="medium">Medium (3x4)</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard (4x4)</button>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="message" id="message"></div>

        <button class="reset-btn" onclick="initGame()">New Game</button>
    </div>

    <script>
        const emojis = ['🎨', '🎭', '🎪', '🎬', '🎤', '🎸', '🎹', '🎺', '🎻', '🥁', '🎯', '🎲', '🎰', '🎮', '🧩', '🎴'];
        let gameBoard = [];
        let flipped = [];
        let matched = [];
        let score = 0;
        let difficulty = 'easy';
        let gameActive = true;

        function getDifficulty() {
            const diffSettings = {
                easy: { rows: 2, cols: 2 },
                medium: { rows: 3, cols: 4 },
                hard: { rows: 4, cols: 4 }
            };
            return diffSettings[difficulty];
        }

        function initGame() {
            const { rows, cols } = getDifficulty();
            const totalCards = rows * cols;
            gameBoard = [];
            flipped = [];
            matched = [];
            score = 0;
            gameActive = true;
            
            document.getElementById('score').textContent = score;
            document.getElementById('message').textContent = '';

            const shuffledEmojis = emojis.slice(0, totalCards / 2).concat(emojis.slice(0, totalCards / 2)).sort(() => Math.random() - 0.5);
            
            for (let i = 0; i < totalCards; i++) {
                gameBoard.push({
                    id: i,
                    emoji: shuffledEmojis[i],
                    flipped: false,
                    matched: false
                });
            }

            renderBoard();
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            const { cols } = getDifficulty();
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            board.innerHTML = '';

            gameBoard.forEach(card => {
                const cardEl = document.createElement('button');
                cardEl.className = 'card';
                if (card.flipped || card.matched) cardEl.classList.add(card.matched ? 'matched' : 'flipped');
                cardEl.textContent = (card.flipped || card.matched) ? card.emoji : '?';
                cardEl.onclick = () => flipCard(card.id);
                board.appendChild(cardEl);
            });
        }

        function flipCard(id) {
            if (!gameActive || flipped.length > 1 || gameBoard[id].flipped || gameBoard[id].matched) return;

            gameBoard[id].flipped = true;
            flipped.push(id);
            renderBoard();

            if (flipped.length === 2) {
                gameActive = false;
                setTimeout(checkMatch, 600);
            }
        }

        function checkMatch() {
            const [id1, id2] = flipped;
            if (gameBoard[id1].emoji === gameBoard[id2].emoji) {
                gameBoard[id1].matched = true;
                gameBoard[id2].matched = true;
                score += 10;
                document.getElementById('score').textContent = score;
                flipped = [];
                gameActive = true;

                if (matched.every((card, i) => gameBoard[i].matched || !card)) {
                    const totalCards = gameBoard.length;
                    const matchedCount = gameBoard.filter(c => c.matched).length;
                    if (matchedCount === totalCards) {
                        document.getElementById('message').textContent = `🎉 You Won! Final Score: ${score}`;
                    }
                }
            } else {
                gameBoard[id1].flipped = false;
                gameBoard[id2].flipped = false;
                flipped = [];
                gameActive = true;
            }
            renderBoard();
        }

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                difficulty = this.dataset.difficulty;
                initGame();
            });
        });

        initGame();
    </script>
</body>
</html>
