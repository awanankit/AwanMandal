<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Click Game</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1f2937;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 520px;
            padding: 24px;
            background: #111827;
            border-radius: 16px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.35);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
            text-align: center;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
            font-size: 1rem;
        }
        #gameArea {
            position: relative;
            width: 100%;
            height: 320px;
            border: 3px solid #374151;
            border-radius: 14px;
            overflow: hidden;
            background: linear-gradient(145deg, #111827 0%, #1f2937 100%);
        }
        #target {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #f59e0b 0%, #d97706 65%, #b45309 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 18px rgba(245,158,11,0.5);
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        p {
            margin: 0 0 8px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quick Click Game</h1>
        <p>Click the moving target as many times as you can before time runs out. Each click moves the target to a new random position.</p>
        <div class="stats">
            <span>Score: <strong id="score">0</strong></span>
            <span>Time left: <strong id="time">15</strong>s</span>
        </div>
        <div id="gameArea">
            <div id="target"></div>
        </div>
        <button id="startButton">Start Game</button>
    </div>

    <script>
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const target = document.getElementById('target');
        const gameArea = document.getElementById('gameArea');
        const startButton = document.getElementById('startButton');

        let score = 0;
        let timeLeft = 15;
        let timerId = null;
        let active = false;

        function randomPosition() {
            const areaRect = gameArea.getBoundingClientRect();
            const size = target.offsetWidth;
            const maxX = areaRect.width - size;
            const maxY = areaRect.height - size;
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            target.style.left = `${x}px`;
            target.style.top = `${y}px`;
        }

        function updateScore() {
            scoreEl.textContent = score;
        }

        function updateTime() {
            timeEl.textContent = timeLeft;
        }

        function endGame() {
            active = false;
            clearInterval(timerId);
            startButton.textContent = 'Restart Game';
            target.style.visibility = 'hidden';
            alert(`Time is up! Your score is ${score}. Try again.`);
        }

        function startGame() {
            score = 0;
            timeLeft = 15;
            updateScore();
            updateTime();
            target.style.visibility = 'visible';
            randomPosition();
            active = true;
            startButton.textContent = 'Playing...';
            startButton.disabled = true;

            timerId = setInterval(() => {
                timeLeft -= 1;
                updateTime();
                if (timeLeft <= 0) {
                    endGame();
                    startButton.disabled = false;
                }
            }, 1000);
        }

        target.addEventListener('click', () => {
            if (!active) return;
            score += 1;
            updateScore();
            randomPosition();
        });

        startButton.addEventListener('click', startGame);
        randomPosition();
    </script>
</body>
</html>
