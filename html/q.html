<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rooftop Rush</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b27;color:#fff;font-family:system-ui, sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.hud{position:absolute;inset:20px 24px auto;display:flex;justify-content:space-between;align-items:start;pointer-events:none;text-shadow:0 2px 8px #000}.logo{font-weight:900;letter-spacing:3px;font-size:20px}.logo span{color:#c8ff4d}.score{font-size:14px;letter-spacing:1px}.score b{color:#c8ff4d;font-size:20px}.panel{position:absolute;inset:0;display:grid;place-items:center;background:#09111aaa;text-align:center;transition:.25s}.panel.off{opacity:0;visibility:hidden}.card{padding:32px;max-width:520px}.kicker{color:#c8ff4d;letter-spacing:4px;font-size:12px;font-weight:bold}.card h1{font-size:clamp(54px,10vw,96px);line-height:.85;margin:15px 0;text-transform:uppercase;font-weight:1000;letter-spacing:-4px}.card h1 span{color:#c8ff4d}.card p{color:#d3dedf;line-height:1.7}.button{border:0;background:#c8ff4d;color:#142018;font-size:16px;font-weight:900;letter-spacing:1px;padding:15px 28px;margin-top:14px;cursor:pointer}.button:hover{background:#e0ff9b}.help{color:#b1c0c2;font-size:12px;margin-top:18px}.mobile{display:none;position:absolute;bottom:24px;right:20px;gap:12px}.mobile button{height:60px;width:60px;border:1px solid #ffffff77;border-radius:50%;background:#13232bbb;color:#fff;font-size:24px;touch-action:none}@media(max-width:650px){.mobile{display:flex}.hud{inset:15px}.card{padding:22px}.card h1{letter-spacing:-2px}.help{max-width:260px;margin:auto;margin-top:18px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="logo">ROOFTOP <span>RUSH</span></div><div class="score">DISTANCE&nbsp; <b id="score">0</b> m<br>BEST&nbsp; <b id="best">0</b> m &nbsp; ◆ <b id="gems">0</b></div></div>
<div class="panel" id="panel"><div class="card"><div class="kicker">/// CITY PARKOUR CHALLENGE</div><h1 id="heading">OWN<br>THE <span>SKY</span></h1><p id="message">Sprint across the rooftops, leap over gaps, duck under signs and scoop up the glowing gems. How far can you run?</p><button class="button" id="play">START RUN&nbsp; →</button><div class="help">SPACE / ↑ JUMP &nbsp; · &nbsp; ↓ SLIDE &nbsp; · &nbsp; R RESTART</div></div></div>
<div class="mobile"><button id="down" aria-label="Slide">↓</button><button id="up" aria-label="Jump">↑</button></div>
<script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),panel=document.querySelector('#panel'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),gemsEl=document.querySelector('#gems');let w,h,dpr,ground,runner,items=[],clouds=[],active=false,ended=false,distance=0,gems=0,speed=370,timer=0,last=0,best=+(localStorage.getItem('roofBest')||0);bestEl.textContent=best;
function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);ground=h*.77}addEventListener('resize',size);size();
function start(){distance=0;gems=0;speed=370;timer=.6;items=[];runner={x:w*.18,y:ground-55,vy:0,on:true,slide:0};active=true;ended=false;gemsEl.textContent='0';panel.classList.add('off');last=performance.now()}
function jump(){if(!active){if(!ended)start();return}if(runner.on){runner.vy=-700;runner.on=false}}
function slide(){if(active&&runner.on)runner.slide=.55}
function finish(){if(!active)return;active=false;ended=true;const n=Math.floor(distance);if(n>best){best=n;localStorage.setItem('roofBest',best);bestEl.textContent=best}document.querySelector('#heading').innerHTML='RUN<br><span>OVER</span>';document.querySelector('#message').innerHTML=`You made it <b style="color:#c8ff4d">${n} m</b> and collected <b style="color:#c8ff4d">${gems}</b> gems. Ready for another shot?`;document.querySelector('#play').textContent='RUN AGAIN →';setTimeout(()=>panel.classList.remove('off'),350)}
function spawn(){let r=Math.random(),type=r<.46?'gap':r<.75?'sign':'box',width=type==='gap'?115+Math.random()*65:type==='sign'?58:45,height=type==='sign'?52:46;items.push({type,x:w+30,width,height,got:false});if(Math.random()<.62)items.push({type:'gem',x:w+90+Math.random()*width,y:ground-105,got:false})}
function draw(){let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#10172f');sky.addColorStop(.65,'#394d70');sky.addColorStop(1,'#e58d69');x.fillStyle=sky;x.fillRect(0,0,w,h);x.fillStyle='#ffe1a0';x.shadowColor='#ffe1a0';x.shadowBlur=28;x.beginPath();x.arc(w*.76,h*.27,32,0,Math.PI*2);x.fill();x.shadowBlur=0;for(let layer=0;layer<3;layer++){let base=ground-layer*52,step=70+layer*23,offset=(distance*(.1+layer*.12))%step;x.fillStyle=['#354d58','#263b48','#192d3a'][layer];for(let a=-step-offset;a<w+step;a+=step){let bh=55+Math.abs(Math.sin(a*4+layer*8))*h*.2;x.fillRect(a,base-bh,step-3,bh);for(let yy=base-bh+14;yy<base-9;yy+=20)for(let xx=a+10;xx<a+step-8;xx+=16){let lit=Math.floor(Math.abs(Math.sin(xx*7+yy*3+layer)));x.fillStyle=lit?'#ffe76b':'#f5d29466';if(lit){x.shadowColor='#ffc94d';x.shadowBlur=9}x.fillRect(xx,yy,4,6);x.shadowBlur=0}x.fillStyle=['#354d58','#263b48','#192d3a'][layer]}}x.fillStyle='#17232a';x.fillRect(0,ground,w,h-ground);x.fillStyle='#c8ff4d';x.shadowColor='#c8ff4d';x.shadowBlur=12;x.fillRect(0,ground,w,3);x.shadowBlur=0;
for(const o of items){if(o.type==='gap'){x.fillStyle='#08111b';x.fillRect(o.x,ground,o.width,h-ground)}else if(o.type==='box'){x.fillStyle='#f18c4e';x.fillRect(o.x,ground-o.height,o.width,o.height);x.strokeStyle='#ffd39a';x.lineWidth=3;x.strokeRect(o.x+5,ground-o.height+5,o.width-10,o.height-10)}else if(o.type==='sign'){x.fillStyle='#e65e55';x.fillRect(o.x,ground-o.height,o.width,o.height);x.fillStyle='#fff0ca';x.font='bold 9px sans-serif';x.fillText('DUCK!',o.x+8,ground-o.height+25)}else{x.fillStyle='#ffe76b';x.shadowColor='#ffe76b';x.shadowBlur=15;x.beginPath();x.arc(o.x,o.y,8,0,7);x.fill();x.shadowBlur=0}}
if(runner){let sl=runner.slide>0,ph=sl?27:55,py=runner.y+(55-ph);x.save();x.translate(runner.x,py);x.fillStyle='#c8ff4d';x.shadowColor='#c8ff4d';x.shadowBlur=12;x.beginPath();x.roundRect(6,10,22,ph-10,8);x.fill();x.shadowBlur=0;x.fillStyle='#fff4d5';x.beginPath();x.arc(17,8,9,0,7);x.fill();x.fillStyle='#17232a';x.fillRect(20,6,6,3);x.strokeStyle='#e9ffad';x.lineWidth=6;x.lineCap='round';let swing=runner.on?Math.sin(performance.now()*.02)*7:3;x.beginPath();x.moveTo(11,ph-5);x.lineTo(7+swing,ph+4);x.moveTo(22,ph-5);x.lineTo(25-swing,ph+4);x.stroke();x.restore()}}
function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-last)/1000||0,.04);last=now;if(active){distance+=speed*dt/9;speed=Math.min(850,390+distance*.2);timer-=dt;if(timer<=0){spawn();timer=Math.max(.48,1.12-(speed-390)/1000)+Math.random()*.22}runner.slide=Math.max(0,runner.slide-dt);runner.vy+=1900*dt;runner.y+=runner.vy*dt;if(runner.y>=ground-55){runner.y=ground-55;runner.vy=0;runner.on=true}for(const o of items){o.x-=speed*dt;if(o.type==='gem'&&!o.got&&Math.abs(o.x-runner.x-17)<25&&Math.abs(o.y-(runner.y+22))<60){o.got=true;gems++;gemsEl.textContent=gems}if(o.type==='gap'&&runner.on&&runner.x+30>o.x&&runner.x<o.x+o.width-8){runner.vy=-520;runner.on=false}if(o.type!=='gap'&&o.type!=='gem'){let rh=runner.slide>0?27:55,top=runner.y+55-rh;if(runner.x+28>o.x&&runner.x+6<o.x+o.width&&top<ground-o.height){runner.vy=-520;runner.on=false}}}items=items.filter(o=>o.x>-100&&!o.got);scoreEl.textContent=Math.floor(distance)}draw()}
requestAnimationFrame(tick);document.querySelector('#play').onclick=start;addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='ArrowDown')slide();if(e.code==='KeyR')start()});c.addEventListener('pointerdown',e=>e.clientY>h*.72?slide():jump());document.querySelector('#up').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#down').addEventListener('pointerdown',e=>{e.preventDefault();slide()});})();
</script>
</body>
</html>
