<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake Chase</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050816;
      color: #fff;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
    }

    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 5;
      background: rgba(4, 12, 27, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      min-width: 240px;
    }

    .hud h1 {
      margin: 0 0 10px;
      font-size: 24px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #34d7ff, #ff4de3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stats {
      display: flex;
      gap: 12px;
      font-size: 15px;
      margin-bottom: 12px;
      color: #d9f5ff;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #021119;
      background: linear-gradient(90deg, #59f1ff, #ff7efc);
      box-shadow: 0 8px 25px rgba(89, 241, 255, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(89, 241, 255, 0.45);
    }

    .tip {
      margin-top: 8px;
      font-size: 13px;
      color: #9cc7d3;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="hud">
    <h1>Neon Snake Chase</h1>
    <div class="stats">
      <span id="score">Score: 0</span>
      <span id="size">Length: 5</span>
    </div>
    <button id="startBtn">Start Game</button>
    <div class="tip">Move your mouse around the screen. The snake follows it and grows when it eats glowing food.</div>
  </div>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');
    const sizeEl = document.getElementById('size');

    const tileSize = 24;
    let width = 0;
    let height = 0;
    let snake = [];
    let food = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let mouse = { x: 0, y: 0 };
    let score = 0;
    let running = false;
    let gameOver = false;
    let lastTime = 0;
    let accumulator = 0;
    const moveInterval = 120;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      mouse.x = width / 2;
      mouse.y = height / 2;
      if (!running) {
        drawScene();
      }
    }

    function resetGame() {
      const startX = Math.floor(width / tileSize / 2);
      const startY = Math.floor(height / tileSize / 2);
      snake = [
        { x: startX, y: startY },
        { x: startX - 1, y: startY },
        { x: startX - 2, y: startY },
        { x: startX - 3, y: startY },
        { x: startX - 4, y: startY }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      food = [];
      spawnFood();
      scoreEl.textContent = `Score: ${score}`;
      sizeEl.textContent = `Length: ${snake.length}`;
      lastTime = 0;
      accumulator = 0;
      drawScene();
    }

    function spawnFood() {
      const maxX = Math.floor(width / tileSize) - 1;
      const maxY = Math.floor(height / tileSize) - 1;
      const desired = Math.min(4, Math.max(2, Math.floor((width * height) / 600000)));
      while (food.length < desired) {
        const x = Math.floor(Math.random() * (maxX + 1));
        const y = Math.floor(Math.random() * (maxY + 1));
        if (snake.some(seg => seg.x === x && seg.y === y)) continue;
        if (food.some(item => item.x === x && item.y === y)) continue;
        food.push({ x, y, seed: Math.random() * Math.PI * 2 });
      }
      if (food.length > desired) {
        food = food.slice(0, desired);
      }
    }

    function startGame() {
      running = true;
      gameOver = false;
      startBtn.textContent = 'Restart';
      resetGame();
      requestAnimationFrame(loop);
    }

    function updateSnake() {
      const head = snake[0];
      const targetX = Math.floor(mouse.x / tileSize);
      const targetY = Math.floor(mouse.y / tileSize);

      let newDir = nextDirection;
      const dx = targetX - head.x;
      const dy = targetY - head.y;

      if (Math.abs(dx) > Math.abs(dy)) {
        newDir = { x: dx > 0 ? 1 : -1, y: 0 };
      } else if (dy !== 0) {
        newDir = { x: 0, y: dy > 0 ? 1 : -1 };
      }

      if ((newDir.x === -direction.x && newDir.y === 0) || (newDir.y === -direction.y && newDir.x === 0)) {
        newDir = direction;
      }

      direction = newDir;
      nextDirection = direction;

      const newHead = { x: head.x + direction.x, y: head.y + direction.y };
      if (
        newHead.x < 0 ||
        newHead.y < 0 ||
        newHead.x >= Math.floor(width / tileSize) ||
        newHead.y >= Math.floor(height / tileSize) ||
        snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)
      ) {
        running = false;
        gameOver = true;
        startBtn.textContent = 'Play Again';
        drawScene();
        return;
      }

      snake.unshift(newHead);

      for (let i = food.length - 1; i >= 0; i--) {
        const item = food[i];
        if (item.x === newHead.x && item.y === newHead.y) {
          score += 10;
          scoreEl.textContent = `Score: ${score}`;
          sizeEl.textContent = `Length: ${snake.length}`;
          food.splice(i, 1);
          break;
        }
      }

      if (food.length < 2) {
        spawnFood();
      }

      if (snake.length > 1 && !food.some(item => item.x === newHead.x && item.y === newHead.y)) {
        snake.pop();
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, '#060b1f');
      gradient.addColorStop(0.5, '#0b113a');
      gradient.addColorStop(1, '#040712');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.globalAlpha = 0.16;
      for (let i = 0; i < 140; i++) {
        const x = (i * 97) % width;
        const y = (i * 143) % height;
        const size = (i % 5) + 1;
        ctx.fillStyle = i % 2 === 0 ? '#4ef7ff' : '#ff5ff1';
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawFood(time) {
      food.forEach((item, index) => {
        const pulse = 0.9 + Math.sin(time * 0.004 + item.seed) * 0.18;
        const x = item.x * tileSize + tileSize / 2;
        const y = item.y * tileSize + tileSize / 2;
        const radius = (tileSize * 0.33) * pulse;

        ctx.save();
        const glow = ctx.createRadialGradient(x, y, 3, x, y, radius * 2.2);
        glow.addColorStop(0, '#fff7c7');
        glow.addColorStop(0.4, '#ff9b4a');
        glow.addColorStop(1, 'rgba(255, 82, 82, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, radius * 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffd266';
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ffb347';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#fff7ca';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - radius * 0.7, y - radius * 0.7);
        ctx.lineTo(x - radius * 0.2, y - radius * 0.2);
        ctx.moveTo(x + radius * 0.7, y - radius * 0.4);
        ctx.lineTo(x + radius * 0.2, y - radius * 0.1);
        ctx.moveTo(x + radius * 0.3, y + radius * 0.7);
        ctx.lineTo(x + radius * 0.1, y + radius * 0.2);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawSnake() {
      snake.forEach((seg, index) => {
        const x = seg.x * tileSize + tileSize / 2;
        const y = seg.y * tileSize + tileSize / 2;
        const isHead = index === 0;

        ctx.save();
        ctx.translate(x, y);
        ctx.shadowBlur = isHead ? 22 : 12;
        ctx.shadowColor = isHead ? '#31f5ff' : '#71e7b7';
        ctx.fillStyle = isHead ? '#31f5ff' : '#7cf4a6';
        ctx.beginPath();
        ctx.roundRect(-tileSize / 2 + 2, -tileSize / 2 + 2, tileSize - 4, tileSize - 4, 8);
        ctx.fill();

        if (!isHead) {
          ctx.fillStyle = '#0d2b39';
          ctx.beginPath();
          ctx.roundRect(-tileSize / 6, -tileSize / 6, tileSize / 3, tileSize / 3, 4);
          ctx.fill();
        }
        ctx.restore();
      });
    }

    function drawScene(time = performance.now()) {
      drawBackground();
      drawFood(time);
      drawSnake();

      if (gameOver) {
        ctx.save();
        ctx.fillStyle = 'rgba(3, 7, 19, 0.7)';
        ctx.fillRect(0, 0, width, height);
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px Segoe UI';
        ctx.fillStyle = '#ffe2f7';
        ctx.fillText('Game Over', width / 2, height / 2 - 10);
        ctx.font = '22px Segoe UI';
        ctx.fillStyle = '#b9dfe9';
        ctx.fillText('Press the button to play again', width / 2, height / 2 + 28);
        ctx.restore();
      }
    }

    function loop(timestamp) {
      if (!running) {
        drawScene();
        return;
      }

      if (!lastTime) {
        lastTime = timestamp;
      }
      const delta = timestamp - lastTime;
      lastTime = timestamp;
      accumulator += delta;

      while (accumulator >= moveInterval) {
        updateSnake();
        accumulator -= moveInterval;
        if (!running) {
          break;
        }
      }

      drawScene(timestamp);
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', resizeCanvas);
    canvas.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    canvas.addEventListener('mouseleave', () => {
      mouse.x = width / 2;
      mouse.y = height / 2;
    });
    startBtn.addEventListener('click', startGame);

    resizeCanvas();
    resetGame();
    drawScene();
  </script>
</body>
</html>
